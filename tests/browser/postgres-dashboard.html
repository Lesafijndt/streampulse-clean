<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:; frame-src 'self' about:"></head>
<body><div id="root"></div><pre id="result">Running</pre><script type="module">
import React from 'react'; import {createRoot} from 'react-dom/client'; import '../../src/index.css';
const prefix='streampulse-gachi-arena:v2', namespace='streampulse-live-deck';
const base=`artifacts/${namespace}/public/data/`;
const now=Date.now(), mode=new URLSearchParams(location.search).get('role')||'streamer';
const login=mode==='moderator'?'paim_beach_pete':'2o3a';
const cleared=new URLSearchParams(location.search).get('cleared')==='1';
const resetTest=new URLSearchParams(location.search).get('reset')==='1';
let backupRequested=false;
if(resetTest){const click=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(this.download){backupRequested=true;return;}return click.call(this);};}
const previousTest=new URLSearchParams(location.search).get('previous')==='1';
const video=(id,status)=>({id,channelRoom:'2o3a',status,platform:'youtube',videoId:id==='a'?'dQw4w9WgXcQ':'abcdefghijk',
url:'https://www.youtube.com/watch?v='+(id==='a'?'dQw4w9WgXcQ':'abcdefghijk'),title:id==='a'?'Preserved playing video':'Imported queued video',
timestamp:now,queueOrder:id==='a'?1:2,playedAt:id==='a'?now:0,requestedBy:'ordinary_viewer',category:'General',mediaType:'Non-Music',
durationSec:180,duration:'3:00',durationSource:'player',voters:[],upvotes:0,thumbnail:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"/%3E'});
localStorage.clear();sessionStorage.clear();
localStorage.setItem(`${prefix}:active-room`,'2o3a');
localStorage.setItem(`${prefix}:room:2o3a:videos`,JSON.stringify([video('a','playing'),video('b','queue')]));
let version=0, imported=cleared, expired=false, commits=0, anonymousReads=0;
const docs={}; const nativeFetch=window.fetch.bind(window);
const json=(value,status=200)=>Promise.resolve(new Response(JSON.stringify(value),{status,headers:{'Content-Type':'application/json'}}));
window.fetch=(input,opts={})=>{
const url=new URL(typeof input==='string'?input:input.url,location.href);
if(!url.pathname.startsWith('/api/'))return nativeFetch(input,opts);
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='store'){
if(expired)return json({authenticated:false,user:null});
if(opts.method==='POST'){
 const body=JSON.parse(opts.body);
 if(body.operation==='reset'){
   if(!backupRequested)throw Error('Reset submitted before requesting backup download');
   if(body.expectedVersion!==version)return json({code:'conflict'},409);
   for(const [path,v]of Object.entries(docs))if(path.includes('/queue_videos/')&&v.status==='queue')delete docs[path];
   version++;return json({ok:true,version,resetAt:Date.now(),statisticsResetAt:0});
 }
 if(body.operation==='import-cache'){for(const v of body.videos)docs[base+'queue_videos/'+v.id]||=v; imported=true;version++;return json({ok:true,version});}
 for(const op of body.operations){const old=docs[op.path];const e=body.expectations?.[op.path];
 if(!e||Boolean(old)!==e.exists||(old&&op.path.includes('queue_videos')&&(old.status!==e.status||old.timestamp!==e.timestamp)))return json({code:'conflict'},409);}
 for(const op of body.operations){if(op.type==='delete')delete docs[op.path];else docs[op.path]=op.merge||op.type==='update'?{...docs[op.path],...op.data}:op.data;}
 version++;commits++;return json({ok:true,version});
}
if(Number(url.searchParams.get('since'))===version)return json({version,unchanged:true});
const collections={queue_videos:[],room_settings:[]};for(const [path,data]of Object.entries(docs)){const parts=path.split('/');if(collections[parts[4]])collections[parts[4]].push({id:parts[5],data});}
return json({version,collections,legacyImported:imported});
}
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='preferences')return json({ok:true,preferences:{}});
if(url.pathname==='/api/twitch/session')return json({authenticated:true,storageBackend:'postgres',role:login==='2o3a'?'streamer':'moderator',user:{id:'123',login,display_name:login}});
if(url.pathname==='/api/twitch/bot-session')return json({active:true,connected:false,code:'webhook_existing',receiptCode:'ok'});
if(url.pathname==='/api/activity-log'){anonymousReads++;return json({events:[],hasMore:false});}
if(url.pathname==='/api/media-metadata')return json({});
return json({ok:true});
};
const wait=async test=>{for(let i=0;i<150;i++){if(test())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out waiting for dashboard');};
try{
const {default:App}=await import('../../src/App.tsx');createRoot(document.querySelector('#root')).render(React.createElement(App));
if(cleared){
await wait(()=>document.querySelector('header')&&!document.body.textContent.includes('Imported queued video'));
if(Object.keys(docs).some(path=>path.includes('/queue_videos/')))throw Error('Stale cache resurrected cleared requests');
}else{
await wait(()=>imported&&document.body.textContent.includes('Imported queued video')&&document.querySelector('header'));
const masthead=document.querySelector('.gachi-supper-masthead');if(masthead.getBoundingClientRect().height>173)throw Error('Banner pushes player down: compact height exceeded');
if(document.querySelector('.gachi-supper-caption').getBoundingClientRect().right>document.querySelector('.gachi-supper-panorama').getBoundingClientRect().left+1)throw Error('Title overlaps banquet faces');
if(!docs[base+'queue_videos/a']||!docs[base+'queue_videos/b'])throw Error('Cached queue was not preserved');
await wait(()=>document.querySelector('[data-widget="stats"]')&&anonymousReads>0);
if(login==='2o3a'&&document.body.textContent.includes('Technical diagnostics'))throw Error('Streamer received moderator diagnostics');
if(resetTest){
HTMLElement.prototype.requestFullscreen=()=>Promise.reject(Error('No native fullscreen in test'));
document.querySelector('[aria-label="Enter player fullscreen"]').click();
await wait(()=>document.querySelector('[data-player-fullscreen="true"]'));
document.querySelector('[aria-label="Exit player fullscreen"]').click();
await wait(()=>!document.querySelector('[data-player-fullscreen="true"]'));
[...document.querySelectorAll('button')].find(b=>b.textContent.trim()==='Options').click();
await wait(()=>[...document.querySelectorAll('button')].some(b=>b.textContent==='Reset queue'));
[...document.querySelectorAll('button')].find(b=>b.textContent==='Reset queue').click();
await wait(()=>document.querySelector('[aria-labelledby="reset-title"]'));
if(!docs[base+'queue_videos/b'])throw Error('Opening confirmation mutated queue');
[...document.querySelectorAll('button')].find(b=>b.textContent==='Confirm reset').click();
await wait(()=>!docs[base+'queue_videos/b']&&!document.querySelector('[aria-labelledby="reset-title"]'));
if(docs[base+'queue_videos/a']?.status!=='playing')throw Error('Reset queue removed playing video');
}else{
const next=[...document.querySelectorAll('button')].find(button=>/next video/i.test((button.title||'')+' '+(button.getAttribute('aria-label')||'')+' '+button.textContent));
if(!next)throw Error('Next video control missing');next.click();
await wait(()=>docs[base+'queue_videos/a']?.status==='watched'&&docs[base+'queue_videos/b']?.status==='playing');
if(!commits)throw Error('Playback did not persist through private API');
if(previousTest){
await new Promise(resolve=>setTimeout(resolve,60));
const skip=()=>[...document.querySelectorAll('button')].find(button=>/next video/i.test((button.title||'')+' '+(button.getAttribute('aria-label')||'')+' '+button.textContent)).click();
skip();await wait(()=>Object.values(docs).filter(v=>v.status==='watched').length===2&&!Object.values(docs).some(v=>v.status==='playing'));
await wait(()=>document.body.textContent.includes('Queue is currently empty'));await new Promise(resolve=>setTimeout(resolve,60));
// Navigation shortcuts still work when a dashboard control has keyboard focus.
const control=document.querySelector('[aria-label="Enter player fullscreen"]');control.focus();control.dispatchEvent(new KeyboardEvent('keydown',{key:'p',code:'KeyP',bubbles:true,cancelable:true}));
await wait(()=>docs[base+'queue_videos/b']?.status==='playing');
await new Promise(resolve=>setTimeout(resolve,60));
if(docs[base+'queue_videos/a']?.status!=='watched')throw Error('Previous changed unrelated history');
if(docs[base+'queue_videos/b'].nextTrackOverrideId!==null)throw Error('Empty queue created a phantom return target');
skip();await wait(()=>!Object.values(docs).some(v=>v.status==='playing'));
await new Promise(resolve=>setTimeout(resolve,60));
document.body.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',code:'ArrowLeft',bubbles:true,cancelable:true}));
await wait(()=>docs[base+'queue_videos/b']?.status==='playing');
}
}
}
expired=true;await new Promise(r=>setTimeout(r,50));
document.body.dataset.testStatus='pass';document.querySelector('#result').textContent=JSON.stringify({pass:true,imported,commits,login});
}catch(error){document.body.dataset.testStatus='fail';document.querySelector('#result').textContent=error.stack+' '+JSON.stringify({docs,commits,text:document.body.innerText.slice(0,1200)});}
</script></body></html>
