<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:; frame-src 'self' about:"></head>
<body><div id="root"></div><pre id="result">Running</pre><script type="module">
import React from 'react'; import {createRoot} from 'react-dom/client'; import '../../src/index.css';
const prefix='streampulse-gachi-arena:v2', namespace='streampulse-live-deck';
const base=`artifacts/${namespace}/public/data/`;
const provider=new URLSearchParams(location.search).get('provider')||'tiktok';
const now=Date.now(), mode=new URLSearchParams(location.search).get('role')||'streamer';
const login=mode==='moderator'?'paim_beach_pete':'2o3a';
const cleared=new URLSearchParams(location.search).get('cleared')==='1';
const resetTest=new URLSearchParams(location.search).get('reset')==='1';
const video=(id,status)=>({id,channelRoom:'2o3a',status,platform:id==='a'?provider:'youtube',videoId:id==='a'?(provider==='tiktok'?'1234567890123456789':'dQw4w9WgXcQ'):'abcdefghijk',
url:id==='a'?(provider==='youtube'?'https://www.youtube.com/shorts/dQw4w9WgXcQ':'https://www.tiktok.com/@viewer/video/1234567890123456789'):'https://www.youtube.com/watch?v=abcdefghijk',title:id==='a'?'Preserved playing video':'Imported queued video',
timestamp:now,queueOrder:id==='a'?1:2,playedAt:id==='a'?now:0,requestedBy:'ordinary_viewer',category:'General',mediaType:'Non-Music',
durationSec:3,duration:'0:03',durationSource:'player',voters:[],upvotes:0,thumbnail:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"/%3E'});
localStorage.clear();sessionStorage.clear();
localStorage.setItem(`${prefix}:active-room`,'2o3a');
localStorage.setItem(`${prefix}:room:2o3a:videos`,JSON.stringify([video('a','playing'),video('b','queue')]));
let transitionWrites=0; let version=0, imported=cleared, expired=false, commits=0, anonymousReads=0;
const docs={}; const nativeFetch=window.fetch.bind(window);
const json=(value,status=200)=>Promise.resolve(new Response(JSON.stringify(value),{status,headers:{'Content-Type':'application/json'}}));
window.fetch=(input,opts={})=>{
const url=new URL(typeof input==='string'?input:input.url,location.href);
if(!url.pathname.startsWith('/api/'))return nativeFetch(input,opts);
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='store'){
if(expired)return json({authenticated:false,user:null});
if(opts.method==='POST'){
 const body=JSON.parse(opts.body);
 if(body.operations?.some(op=>op.data?.status==='playing'&&op.path.endsWith('/b'))) transitionWrites++; 
 if(body.operation==='reset'){
   if(body.expectedVersion!==version)return json({code:'conflict'},409);
   for(const [path,v]of Object.entries(docs))if(path.includes('/queue_videos/')&&v.status==='queue')delete docs[path];
   version++;return json({ok:true,version,resetAt:Date.now(),statisticsResetAt:0});
 }
 if(body.operation==='import-cache'){for(const v of body.videos)docs[base+'queue_videos/'+v.id]||=v; imported=true;version++;return json({ok:true,version});}
 for(const op of body.operations){const old=docs[op.path];const e=body.expectations?.[op.path];
 if(!e||Boolean(old)!==e.exists||(old&&op.path.includes('queue_videos')&&(old.status!==e.status||old.timestamp!==e.timestamp)))return json({code:'conflict'},409);}
 for(const op of body.operations){if(op.type==='delete')delete docs[op.path];else docs[op.path]=op.merge||op.type==='update'?{...docs[op.path],...op.data}:op.data;}
 version++;commits++;return json({ok:true,version});
}
if(Number(url.searchParams.get('since'))===version)return json({version,unchanged:true});
const collections={queue_videos:[],room_settings:[]};for(const [path,data]of Object.entries(docs)){const parts=path.split('/');if(collections[parts[4]])collections[parts[4]].push({id:parts[5],data});}
return json({version,collections,legacyImported:imported});
}
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='preferences')return json({ok:true,preferences:{streamSettings:{autoPlayNext:new URLSearchParams(location.search).get('scenario')!=='stopped'}}});
if(url.pathname==='/api/twitch/session')return json({authenticated:true,storageBackend:'postgres',role:login==='2o3a'?'streamer':'moderator',user:{id:'123',login,display_name:login}});
if(url.pathname==='/api/twitch/bot-session')return json({active:true,connected:false,code:'webhook_existing',receiptCode:'ok'});
if(url.pathname==='/api/activity-log'){anonymousReads++;return json({events:[],hasMore:false});}
if(url.pathname==='/api/media-metadata')return json({});
return json({ok:true});
};
const wait=async test=>{for(let i=0;i<150;i++){if(test())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out waiting for dashboard');};

// Same-origin stand-ins capture the actual App's provider protocol without loading remote media.
const errors=[];window.addEventListener('error',e=>errors.push(e.message));
let renderCommits=0,playbackWrites=0;const originalStorageSet=Storage.prototype.setItem;Storage.prototype.setItem=function(key,value){if(this===sessionStorage&&String(key).includes('player-playback-intent'))playbackWrites++;return originalStorageSet.call(this,key,value)};
const commands=[];const setAttribute=Element.prototype.setAttribute;
Element.prototype.setAttribute=function(name,value){if(this.tagName==='IFRAME'&&name==='src'){this.dataset.providerSrc=value;return setAttribute.call(this,name,'about:blank')}return setAttribute.call(this,name,value)};
const descriptor=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,'contentWindow');const registered=new WeakSet();
Object.defineProperty(HTMLIFrameElement.prototype,'contentWindow',{get(){const target=descriptor.get.call(this);if(target){target.postMessage=(data,origin)=>{let payload=data;if(typeof payload==='string'){try{payload=JSON.parse(payload)}catch{}}commands.push({frame:this,data:payload,origin})}}return target}});
const emit=(frame,type,value)=>window.dispatchEvent(new MessageEvent('message',{source:frame.contentWindow,origin:provider==='tiktok'?'https://www.tiktok.com':'https://www.youtube.com',data:provider==='tiktok'?{type,value,'x-tiktok-player':true}:{event:type,info:value}}));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,msg)=>{if(!v)throw Error(msg)};
const calls=(frame,name)=>commands.filter(c=>c.frame===frame&&(c.data.type===name||c.data.func===name));
const frame=()=>[...document.querySelectorAll('iframe[data-provider-src]')].find(f=>/youtube.com\/embed|tiktok.com\/player/.test(f.dataset.providerSrc));
try{
 const scenario=new URLSearchParams(location.search).get('scenario')||'ended';
 const {default:App}=await import('../../src/App.tsx');const root=createRoot(document.querySelector('#root'));
 root.render(React.createElement(React.Profiler,{id:"playback",onRender:()=>{renderCommits++}},React.createElement(App)));await wait(()=>imported&&frame());await sleep(100);
 const first=frame();const time=(seconds,state=1)=>provider==='tiktok'
   ?emit(first,'onCurrentTime',{currentTime:seconds,duration:3})
   :emit(first,'infoDelivery',{currentTime:seconds,duration:3,playerState:state,volume:50,muted:false});
 if(provider==='tiktok')emit(first,'onPlayerReady');
 window.dispatchEvent(new MessageEvent('message',{source:first.contentWindow,origin:'https://evil.example',data:{event:'onStateChange',info:0,type:'onStateChange',value:0,'x-tiktok-player':true}}));
 window.dispatchEvent(new MessageEvent('message',{source:window,origin:'https://www.youtube.com',data:{event:'onStateChange',info:0}}));
 assert(transitionWrites===0,'Untrusted messages must not transition');
 emit(first,'onStateChange',1);if(scenario!=='partial'&&!scenario.startsWith('late-duration'))time(1);await sleep(20);
 if(scenario==='stopped'){
   const before=calls(first,provider==='tiktok'?'play':'playVideo').length;
   emit(first,'onStateChange',0);
   if(provider==='tiktok')emit(first,'onPlayerReady');else emit(first,'onReady');
   await sleep(2400);
   assert(transitionWrites===0,'Auto-next disabled must leave queue intact');
   assert(calls(first,provider==='tiktok'?'play':'playVideo').length===before,'Startup retries and late Ready must not replay a completed clip');
   root.unmount();document.body.dataset.testStatus='pass';document.querySelector('#result').textContent='PASS '+provider+': completed clip is not replayed by startup retries';
 }else{
 if(scenario.startsWith('late-duration')){
   const timingEvent=provider==='tiktok'?'onCurrentTime':'infoDelivery';
   emit(first,timingEvent,{currentTime:2.75,playerState:1});
   emit(first,timingEvent,{currentTime:3,playerState:1});
   emit(first,timingEvent,{currentTime:3});await sleep(50);
   assert(transitionWrites===0,'Metadata estimates alone must not complete a Short');
   emit(first,provider==='tiktok'?'onCurrentTime':'initialDelivery',scenario==='late-duration-repeat'?{duration:3,currentTime:3}:{duration:3});
 }else if(scenario==='partial-position'){
   time(2);first.focus();emit(first,'onStateChange',2);
   for(const value of [{duration:3},{duration:3,currentTime:null},{duration:3,currentTime:''},{duration:3,currentTime:false},{duration:3,currentTime:-1},{duration:3,currentTime:Infinity}])emit(first,'onCurrentTime',value);
   window.dispatchEvent(new PageTransitionEvent('pagehide'));await sleep(50);
   assert(Object.values(sessionStorage).some(value=>{try{return JSON.parse(value).seconds===2}catch{return false}}),'Partial or invalid timing must preserve the saved position at 2 seconds');
   assert(transitionWrites===0,'Partial timing must respect native pause');
   emit(first,'onStateChange',1);time(2);emit(first,'onCurrentTime',{currentTime:3});
 }else if(scenario==='invalid-state'){
   for(const value of [null,undefined,'',false,true,[],{},'0',4,Infinity])emit(first,'onStateChange',value);
   await sleep(50);assert(transitionWrites===0,'Only a valid numeric ENDED state may complete playback');
   time(2);time(3);
 }else if(scenario==='buffering'){
   emit(first,'onStateChange',3);time(3);emit(first,'onCurrentTime',{duration:3});await sleep(50);
   assert(transitionWrites===0,'Buffering at the boundary must not complete playback');
   emit(first,'onStateChange',1);time(2);time(3);
 }else if(scenario==='partial'){
   emit(first,'initialDelivery',{duration:3,playerState:1,currentTime:1});await sleep(50);
   const beforeRender=renderCommits,beforeWrites=playbackWrites;
   for(let group=0;group<10;group++){
     for(let tick=0;tick<10;tick++)emit(first,'infoDelivery',{currentTime:1+(group*10+tick)/1000,duration:3,playerState:1,volume:50,muted:false});
     await sleep(15);
   }
   assert(renderCommits-beforeRender<6,'Progress burst must not rerender dashboard for each tick: '+(renderCommits-beforeRender));
   assert(playbackWrites-beforeWrites<4,'Progress burst must not synchronously persist every tick: '+(playbackWrites-beforeWrites));
   window.dispatchEvent(new PageTransitionEvent('pagehide'));
   assert(Object.values(sessionStorage).some(value=>{try{return JSON.parse(value).seconds===1.099}catch{return false}}),'Closing/reloading the tab flushes its latest precise position');
   emit(first,'infoDelivery',{currentTime:2.95,playerState:1});emit(first,'infoDelivery',{currentTime:3,playerState:1});
 }else if(scenario==='paused'){
   first.focus();emit(first,'onStateChange',2);time(3,2);await sleep(2200);
   assert(transitionWrites===0&&docs[base+'queue_videos/a'].status==='playing','Paused timeline at duration must not skip');
   emit(first,'onStateChange',1);time(1);time(3);
 }else if(scenario==='boundary'){
   time(2.9);time(0);await sleep(20);
   assert(transitionWrites===0,'Near-end rewind must not be guessed as completion');
   time(2.95);time(3);
 }else{
   time(2.95);first.focus();emit(first,'onStateChange',2);
   time(0,2);emit(first,'onStateChange',0);
 }
 await wait(()=>docs[base+'queue_videos/b']?.status==='playing'&&frame()!==first);
 emit(first,'onStateChange',0);emit(first,'onStateChange',1);emit(first,'onStateChange',0);
 if(provider==='tiktok')emit(first,'onPlayerReady');else emit(first,'onReady');
 await wait(()=>docs[base+'queue_videos/b']?.status==='playing'&&frame()!==first);await sleep(1600);
 assert(transitionWrites===1,'Completion must persist exactly one transition, got '+transitionWrites);
 assert(docs[base+'queue_videos/a'].status==='watched','Completed request must enter history');
 assert(new URL(frame().dataset.providerSrc).searchParams.get('autoplay')==='1','Next video must autoplay');
 assert(docs[base+'queue_videos/b'].status==='playing','Repeated outgoing messages must not skip next video');
 assert(calls(frame(),'setVolume').some(c=>c.data.args[0]===50),'Next YouTube player preserves default 50 volume');
 root.unmount();document.body.dataset.testStatus='pass';document.querySelector('#result').textContent='PASS '+provider+' '+scenario+': one persisted completion; next autoplay; pause and rewind respected; source/origin isolation; volume 50';
 }
}catch(error){document.body.dataset.testStatus='fail';document.querySelector('#result').textContent=error.stack+' errors='+JSON.stringify(errors)+' commands='+JSON.stringify(commands.slice(-12).map(c=>c.data));}
</script></body></html>
