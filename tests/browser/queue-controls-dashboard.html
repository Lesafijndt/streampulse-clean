<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:; img-src 'self' data:; frame-src 'self' about:"></head>
<body><div id="root"></div><pre id="result">Running</pre><script type="module">
import {rememberCategory} from '../../src/categoryMemory.js';
import React from 'react'; import {createRoot} from 'react-dom/client'; import '../../src/index.css';
const prefix='streampulse-gachi-arena:v2', namespace='streampulse-live-deck';
const base=`artifacts/${namespace}/public/data/`;
const provider=new URLSearchParams(location.search).get('provider')||'tiktok';
const now=Date.now(), mode=new URLSearchParams(location.search).get('role')||'streamer';
const login=mode==='moderator'?'paim_beach_pete':'2o3a';
const cleared=new URLSearchParams(location.search).get('cleared')==='1';
const resetTest=new URLSearchParams(location.search).get('reset')==='1';
const video=(id,status)=>({id,channelRoom:'2o3a',status,platform:id==='a'?provider:'youtube',videoId:id==='a'?(provider==='tiktok'?'1234567890123456789':'dQw4w9WgXcQ'):'abcdefghijk',
url:id==='a'?(provider==='youtube'?'https://www.youtube.com/shorts/dQw4w9WgXcQ':'https://www.tiktok.com/@viewer/video/1234567890123456789'):'https://www.youtube.com/watch?v=abcdefghijk',title:id==='a'?'Preserved playing video':'Imported queued video',
timestamp:now,queueOrder:id==='a'?1:2,playedAt:id==='a'?now:0,requestedBy:'ordinary_viewer',category:'General',mediaType:'Non-Music',
promotion:id==='a'?{id:'paid',state:'active',points:450,requestTimestamp:now}:undefined,durationSec:3,duration:'0:03',durationSource:'player',voters:[],upvotes:0,thumbnail:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"/%3E'});
localStorage.clear();sessionStorage.clear();
localStorage.setItem(`${prefix}:active-room`,'2o3a');
localStorage.setItem(`${prefix}:room:2o3a:videos`,JSON.stringify([video('a','playing'),{...video('b','queue'),platform:'tiktok',url:'https://www.tiktok.com/@viewer/video/1234567890123456789',videoId:'1234567890123456789',title:'Yes King Creature And Winter',category:'Clips'}, {...video('c','queue'),videoId:'12345678901',url:'https://www.youtube.com/watch?v=12345678901',queueOrder:3,title:'Forsen reacts to a meme'}]));
let shuffleCalls=0; let conflict=false; let transitionWrites=0; let version=0, imported=cleared, expired=false, commits=0, anonymousReads=0;
let pointsReads=0;let recoveryReads=0,restores=0,reportsRead=0,reportsSaved=0,learned=0;const docs={}; const nativeFetch=window.fetch.bind(window);
const json=(value,status=200)=>Promise.resolve(new Response(JSON.stringify(value),{status,headers:{'Content-Type':'application/json'}}));
window.fetch=(input,opts={})=>{
const url=new URL(typeof input==='string'?input:input.url,location.href);
if(!url.pathname.startsWith('/api/'))return nativeFetch(input,opts);
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='store'){
if(url.searchParams.get('view')==='points'){pointsReads++;assert(login==='paim_beach_pete','Private points diagnostics');return json(url.searchParams.get('verify')==='1'?{ok:true,channel:'2o3a'}:{configured:true,purchases:[]});}
if(url.searchParams.get('view')==='playback-reports'){reportsRead++;return json({reports:[]});}
if(url.searchParams.get('view')==='recovery'){recoveryReads++;return json({snapshots:[{id:'recovery-one',at:now,actor:'paim_beach_pete',action:'Reorder queue',affected:2}],actions:[]});}
if(expired)return json({authenticated:false,user:null});
if(opts.method==='POST'){
 const body=JSON.parse(opts.body);
 if(body.operation==='report-playback'){reportsSaved++;assert(login==='paim_beach_pete','Only moderator reports');assert(!body.url&&!body.token,'No secret or frame URLs sent');return json({ok:true,report:{at:Date.now(),title:'Preserved playing video',platform:'youtube',issue:body.issue}});}
 if(body.operation==='learn-category'){learned++;const row=docs[base+'queue_videos/'+body.id];assert(body.generation===[row.id,row.timestamp,row.playedAt||0].join(':'),'Correction generation verified');row.category=body.category;row.categoryManuallySet=true;const settings=docs[base+'room_settings/2o3a']||{};settings.categoryCorrections=rememberCategory(settings.categoryCorrections,row,body.category);docs[base+'room_settings/2o3a']=settings;version++;return json({ok:true,categoryCorrections:settings.categoryCorrections});}
 if(body.operation==='undo-snapshot'){restores++;return json({ok:true,restored:2,skipped:0});}
 if(body.operation==='unshuffle'){docs[base+'queue_videos/b'].queueOrder=2;docs[base+'queue_videos/c'].queueOrder=3;version++;return json({ok:true,version});}
 if(body.operation==='shuffle'){
   shuffleCalls++;
   if(body.expectedVersion!==version)throw Error('Shuffle did not use snapshot version');
   if(Object.keys(body).sort().join(',')!=='expectedVersion,operation')throw Error('Shuffle must not send a client batch');
   if(conflict){docs[base+'queue_videos/b'].title='Changed by another session';version++;return json({code:'conflict'},409);}
   return new Promise(resolve=>setTimeout(()=>{docs[base+'queue_videos/b'].queueOrder=3;docs[base+'queue_videos/c'].queueOrder=2;version++;resolve(new Response(JSON.stringify({ok:true,version}),{headers:{'Content-Type':'application/json'}}));},100));
 }
 if(body.operations?.some(op=>op.data?.status==='playing'&&op.path.endsWith('/b'))) transitionWrites++; 
 if(body.operation==='reset'){
   if(body.expectedVersion!==version)return json({code:'conflict'},409);
   for(const [path,v]of Object.entries(docs))if(path.includes('/queue_videos/')&&v.status==='queue')delete docs[path];
   version++;return json({ok:true,version,resetAt:Date.now(),statisticsResetAt:0});
 }
 if(body.operation==='import-cache'){for(const v of body.videos)docs[base+'queue_videos/'+v.id]||=v; imported=true;version++;return json({ok:true,version});}
 for(const op of body.operations){const old=docs[op.path];const e=body.expectations?.[op.path];
 if(!e||Boolean(old)!==e.exists||(old&&op.path.includes('queue_videos')&&(old.status!==e.status||old.timestamp!==e.timestamp)))return json({code:'conflict'},409);}
 for(const op of body.operations){if(op.type==='delete')delete docs[op.path];else docs[op.path]=op.merge||op.type==='update'?{...docs[op.path],...op.data}:op.data;}
 version++;commits++;return json({ok:true,version});
}
if(Number(url.searchParams.get('since'))===version)return json({version,unchanged:true});
const collections={queue_videos:[],room_settings:[]};for(const [path,data]of Object.entries(docs)){const parts=path.split('/');if(collections[parts[4]])collections[parts[4]].push({id:parts[5],data});}
return json({version,collections,legacyImported:imported});
}
if(url.pathname==='/api/twitch/session'&&url.searchParams.get('action')==='preferences')return json({ok:true,preferences:{streamSettings:{autoPlayNext:new URLSearchParams(location.search).get('scenario')!=='stopped'}}});
if(url.pathname==='/api/twitch/session')return json({authenticated:true,storageBackend:'postgres',role:login==='2o3a'?'streamer':'moderator',user:{id:'123',login,display_name:login}});
if(url.pathname==='/api/twitch/bot-session')return json({active:true,connected:false,code:'webhook_existing',receiptCode:'ok'});
if(url.pathname==='/api/activity-log'){anonymousReads++;return json({events:[],hasMore:false});}
if(url.pathname==='/api/media-metadata')return json({});
return json({ok:true});
};
const wait=async test=>{for(let i=0;i<150;i++){if(test())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out waiting for dashboard');};

// Same-origin stand-ins capture the actual App's provider protocol without loading remote media.
const errors=[];window.addEventListener('error',e=>errors.push(e.message));
const commands=[];const setAttribute=Element.prototype.setAttribute;
Element.prototype.setAttribute=function(name,value){if(this.tagName==='IFRAME'&&name==='src'){this.dataset.providerSrc=value;return setAttribute.call(this,name,'about:blank')}return setAttribute.call(this,name,value)};
const descriptor=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,'contentWindow');const registered=new WeakSet();
Object.defineProperty(HTMLIFrameElement.prototype,'contentWindow',{get(){const target=descriptor.get.call(this);if(target){target.postMessage=(data,origin)=>{let payload=data;if(typeof payload==='string'){try{payload=JSON.parse(payload)}catch{}}commands.push({frame:this,data:payload,origin})}}return target}});
const emit=(frame,type,value)=>window.dispatchEvent(new MessageEvent('message',{source:frame.contentWindow,origin:provider==='tiktok'?'https://www.tiktok.com':'https://www.youtube.com',data:provider==='tiktok'?{type,value,'x-tiktok-player':true}:{event:type,info:value}}));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,msg)=>{if(!v)throw Error(msg)};
const calls=(frame,name)=>commands.filter(c=>c.frame===frame&&(c.data.type===name||c.data.func===name));
const frame=()=>[...document.querySelectorAll('iframe[data-provider-src]')].find(f=>/youtube.com\/embed|tiktok.com\/player/.test(f.dataset.providerSrc));
try{
 const {default:App}=await import('../../src/App.tsx');const root=createRoot(document.querySelector('#root'));root.render(React.createElement(App));await wait(()=>imported&&frame());await sleep(50);
 const categorySelectors=[...document.querySelectorAll('select[title="Click to fix or change category"]')];
 assert(categorySelectors.some(select=>select.value==='Memes'&&select.selectedOptions[0].textContent.trim()==='Shitposts'),'Existing misfiled TikTok meme displays Shitposts with matching select value');
 assert(categorySelectors.every(select=>![...select.options].some(option=>option.value==='Clips')),'Non-Twitch requests cannot be assigned Twitch Clips');
 const forsenSelector=categorySelectors.find(select=>select.value==='Forsen');assert(forsenSelector,'Existing automatic Forsen request reclassified with valid dropdown option');
 const forsenFilter=[...document.querySelectorAll('button')].find(button=>button.querySelector('span')?.textContent==='Forsen');assert(forsenFilter,'Forsen filter exists');forsenFilter.click();await sleep(30);
 assert(document.querySelectorAll('.gachi-queue-item').length===1&&document.querySelector('.gachi-queue-item').textContent.includes('Forsen reacts'),'Forsen filter shows related request only');
 [...document.querySelectorAll('button')].find(button=>button.querySelector('span')?.textContent==='All Categories').click();await sleep(30);
 const first=frame(),live=JSON.stringify(docs[base+'queue_videos/a']);
 const target=[...document.querySelectorAll('select[title="Click to fix or change category"]')].find(select=>select.value==='Forsen');target.value='IRL';target.dispatchEvent(new Event('change',{bubbles:true}));
 await wait(()=>learned===1&&[...document.querySelectorAll('select[title="Click to fix or change category"]')].some(select=>select.value==='IRL'));
 assert(docs[base+'queue_videos/c'].categoryManuallySet&&frame()===first,'Correction is saved without replacing playing frame');
 assert(document.body.textContent.includes('450 points spent'),'Player displays promotion spending');
 if(login==='paim_beach_pete'){
  const pointsButton=[...document.querySelectorAll('button')].find(button=>button.textContent==='StreamElements points diagnostics');assert(pointsButton,'Moderator points diagnostics');pointsButton.click();await wait(()=>pointsReads===1);
  [...document.querySelectorAll('button')].find(button=>button.textContent==='Check connection (read-only)').click();await wait(()=>pointsReads===2&&document.body.textContent.includes('JWT verified for 2o3a'));
  pointsButton.click();
  [...document.querySelectorAll('button')].find(button=>button.textContent==='Report playback issue').click();await wait(()=>reportsRead===1);
  const issue=document.querySelector('[aria-label="Playback issue type"]');issue.value='stutter';issue.dispatchEvent(new Event('change',{bubbles:true}));await sleep(30);
  [...document.querySelectorAll('button')].find(button=>button.textContent==='Save playback report').click();await wait(()=>reportsSaved===1&&document.body.textContent.includes('Playback issue saved.'));
  assert(frame()===first&&JSON.stringify(docs[base+'queue_videos/a'])===live,'Reporting never modifies playback');
  const panel=document.querySelector('[aria-label="Private playback reports"]'), bounds=panel.getBoundingClientRect(), player=panel.closest('[data-player-fullscreen]').getBoundingClientRect();
  assert(bounds.left>=player.left&&bounds.right<=player.right&&bounds.bottom<=player.bottom,'Report panel stays inside player card');
  [...document.querySelectorAll('button')].find(button=>button.textContent==='Report playback issue').click();
 }else{assert(!document.body.textContent.includes('StreamElements points diagnostics')&&pointsReads===0,'No technical points UI or requests for streamer');assert(!document.body.textContent.includes('Report playback issue')&&reportsRead===0&&reportsSaved===0,'Streamer has no technical report UI or requests');}
 if(login==='2o3a'){
 const next=[...document.querySelectorAll('button[title="Move to next"]')].at(-1);assert(next,'Move next is visible to the streamer');next.click();await wait(()=>docs[base+'queue_videos/c'].queueOrder<docs[base+'queue_videos/b'].queueOrder);
 assert(frame()===first&&JSON.stringify(docs[base+'queue_videos/a'])===live,'Move next must not interrupt playing video');
 let scrolls=0;window.scrollBy=()=>{scrolls++};Element.prototype.scrollBy=()=>{scrolls++};const card=document.querySelector('.gachi-queue-item[draggable="true"]');assert(card,'Waiting card has a drag handle');card.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:new DataTransfer()}));await sleep(30);window.dispatchEvent(new DragEvent('dragover',{clientY:window.innerHeight-2}));await sleep(100);assert(scrolls>0,'Dragging near viewport edge scrolls');card.dispatchEvent(new DragEvent('dragend',{bubbles:true}));await sleep(50);const stopped=scrolls;await sleep(60);assert(scrolls===stopped,'Scrolling stops on drag end');
 assert(recoveryReads===0,'Recovery history loads only when requested');
 assert(!document.querySelector('[aria-label="Open queue recovery history"]'),'No recovery button beside shuffle');
 [...document.querySelectorAll('button')].find(button=>button.textContent.trim().toLowerCase()==='options').click();await wait(()=>[...document.querySelectorAll('button')].some(button=>button.textContent.trim().startsWith('Settings')));
 [...document.querySelectorAll('button')].find(button=>button.textContent.trim().startsWith('Settings')).click();await wait(()=>document.querySelector('[aria-label="Queue recovery history"]')?.textContent.includes('Reorder queue'));window.confirm=()=>true;
 assert(!document.body.textContent.includes('Queue backup & recovery')&&!document.body.textContent.includes('Auto-Advance to Next Video'),'Streamer settings show recovery without moderator technical settings');
 [...document.querySelector('[aria-label="Queue recovery history"]').querySelectorAll('button')].find(button=>button.textContent==='Undo change').click();await wait(()=>restores===1);await sleep(30);
 assert(recoveryReads>0&&frame()===first&&JSON.stringify(docs[base+'queue_videos/a'])===live,'Streamer can view recovery history and undo without interrupting playback');
 assert(pointsReads===0&&!document.body.textContent.includes('StreamElements points diagnostics'),'Recovery access does not expose payment diagnostics');assert(!document.querySelector('[aria-label^="Connection details:"]'),'Streamer has no technical badge');
 }else{
 const options=[...document.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='options');options.click();await wait(()=>[...document.querySelectorAll('button')].some(b=>b.textContent.trim().startsWith('Settings')));const settings=[...document.querySelectorAll('button')].find(b=>b.textContent.trim().startsWith('Settings'));assert(settings,'Moderator has settings');settings.click();await wait(()=>document.querySelector('[aria-label="Moderator recovery history"]'));
 await wait(()=>document.querySelector('[aria-label="Moderator recovery history"]').textContent.includes('Reorder queue'));window.confirm=()=>true;
 [...document.querySelector('[aria-label="Moderator recovery history"]').querySelectorAll('button')].find(b=>b.textContent==='Undo change').click();await wait(()=>restores===1);await sleep(50);
 assert(frame()===first&&JSON.stringify(docs[base+'queue_videos/a'])===live,'Moderator recovery refresh preserves playing iframe');
 }
 root.unmount();document.body.dataset.testStatus='pass';document.querySelector('#result').textContent='PASS '+login+': move next, edge scroll, private recovery and playing-frame preservation';
}catch(error){document.body.dataset.testStatus='fail';document.querySelector('#result').textContent=error.stack+' errors='+JSON.stringify(errors)+' learning='+learned+' reportRead='+reportsRead+' saved='+reportsSaved+' text='+document.querySelector('#root').textContent.slice(-1800);}
</script></body></html>
