name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Install browser regression runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Run browser regression tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/whale-cum-vite.log 2>&1 &
          echo $! > /tmp/whale-cum-vite.pid
          trap 'echo "--- Vite server diagnostics ---"; tail -n 120 /tmp/whale-cum-vite.log' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          WHALE_CUM_TEST_BASE_URL=http://127.0.0.1:5173 node --test tests/browser/*.test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Report dependency audit findings
        run: npm audit --audit-level=high
        continue-on-error: true
